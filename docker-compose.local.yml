version: '3.8'

services:
  postgres:
    # postgres:17.2 is supported on aws rds
    image: postgres:17.2
    ports:
      - ${PGPORT}:${PGPORT}
    environment:
      POSTGRES_USER: ${PGUSERNAME}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      PGPORT: ${PGPORT}
    volumes:
      - ./.db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - ./.redis-data:/data
    command: redis-server --appendonly yes
